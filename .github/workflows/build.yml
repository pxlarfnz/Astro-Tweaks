name: Build Astro

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Astro
        run: cargo build --release

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "target/release/Astro.exe")) {
            Write-Host "Astro.exe was not found. Release directory contents:"
            Get-ChildItem "target/release" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Upload Astro.exe
        uses: actions/upload-artifact@v4
        with:
          name: Astro-Windows
          path: target/release/Astro.exe
          if-no-files-found: error

